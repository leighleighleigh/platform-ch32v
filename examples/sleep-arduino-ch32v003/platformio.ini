; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ch32]
platform = ch32v
; framework = arduino
framework = noneos-sdk
board = genericCH32V003F4U6
board_build.core = ch32v003
board_build.use_lto = yes
build_flags =
  -lprintf
  -DSDI_PRINT=1

; Serial port /dev/ttyACM0 will be used with SDI print
monitor_speed = 115200

; Need to modify the upload command, so that SDI print gets turned on
upload_protocol = wlink
upload_command = wlink flash $UPLOADERFLAGS $SOURCE
upload_flags = 
  --enable-sdi-print 

; Extra libraries from git (arduino only)
; lib_deps = 
;   https://github.com/vuhazu/ch32_deep_sleep